services:
  database:
    image: mysql:8.0
    container_name: itp_db
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: docker/backend/dockerfile
    container_name: itp_backend
    restart: always
    expose:
      - "3001"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: database
    depends_on:
      - database

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/dockerfile
    container_name: itp_frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    container_name: itp_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/nginx/ssl/itp-app:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  mysql_data:
