name: Deploy on production

on:
  push:
    branches:
      - release 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Localhost Check
        run: |
          cd frontend
          if grep -q "localhost" src/MainApp.jsx; then
            echo "ERR! localhost found in MainApp.jsx! Change it to PROD domain before pushing."
            exit 1
          elif grep -q "itp.eduardbonea.com" src/MainApp.jsx; then
            echo "PROD domain found. Proceeding..."
          else
            echo "WARNING: Neither localhost or PROD domain found in MainApp.jsx. Check your config!"
            exit 1
          fi

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/html/ITP-app

            git fetch origin
            git reset --hard origin/release

            cd frontend
            npm ci
            npm run build

            cd ../backend
            npm ci
            pm2 reload ITP-app

            sudo systemctl reload nginx

            sleep 5

            curl -f https://itp.eduardbonea.com || exit 1

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://itp.eduardbonea.com/api/login)
            echo "Login Status: $STATUS"
            
            if [ "$STATUS" -eq 404 ] || [ "$STATUS" -ge 500 ]; then
              echo "Error at login route (Status $STATUS)"
              exit 1
            fi

            echo "Deploy finished successfully!"